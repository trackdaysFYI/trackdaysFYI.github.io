<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lap records from trackdays.fyi">
  <title>Lap Records - Trackdays.fyi</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="css/records.css" type="text/css" rel="stylesheet" />
  <link href="css/record-form.css" type="text/css" rel="stylesheet" />

</head>
<body>
  <div class="shell">
  <header>
    <a class="brand" href="index.html">
      <img src="img/tach.svg" width="56" alt="">
      <span class="brand-name"><b>Trackdays</b>.fyi</span>
    </a>
    <div class="title-block">
      <h1>Lap Records</h1>
    </div>
  </header>
  <div id="content">
  <p id="print-filters" class="print-filters"></p>
  <div class="filters">
    <div class="filter-fields">
    <label class="search">Search
      <input id="name" type="search" placeholder="Name(s), number(s), or vehicle(s), comma-separated" autocomplete="off">
    </label>
    <label class="track">Track
      <select id="track"></select>
    </label>
    <label>Vehicle
      <select id="vehicle">
        <option value="">All</option>
        <option value="C">Car</option>
        <option value="M">Bike</option>
      </select>
    </label>
    <label>Class
      <select id="class"></select>
    </label>
    <label id="subtrack-filter">Subtrack
      <select id="subtrack"></select>
    </label>
    </div>
  </div>
  <div id="records-view">
  <div class="results-bar">
    <div class="status-row">
      <div class="view-switch">
        <button type="button" class="on" id="add-record" disabled>Add lap record</button>
      </div>
      <p id="status" class="status" hidden></p>
      <button type="button" id="retry-load" hidden>Retry</button>
    </div>
    <div class="view-switch" role="group" aria-label="Arrange records">
      <button type="button" id="view-class" class="on">Class</button>
      <button type="button" id="view-time">Time</button>
    </div>
  </div>
  <div id="lap-charts" class="lap-charts" hidden></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th id="track-col">Track</th>
          <th id="subtrack-col">Subtrack</th>
          <th>Holder</th>
          <th>Vehicle</th>
          <th id="class-col">Class</th>
          <th>Date</th>
          <th class="evidence">Evidence</th>
          <th class="actions"> </th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr>
          <td class="loading-cell" colspan="9">
            <div class="loading" role="status" aria-live="polite">
              <span class="loading-bar"></span>
              <p>Loading lap records...</p>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="export-actions">
    <div class="export-buttons">
      <button type="button" id="print-records" disabled>Print</button>
      <button type="button" id="export-csv" disabled>Export CSV</button>
    </div>
  </div>
  </div>
  </div>
  </div>

  <dialog id="recordDialog" class="suggest-dialog" aria-labelledby="recordTitle"></dialog>

  <dialog id="changeDialog" class="suggest-dialog" aria-labelledby="changeTitle">
    <form id="change-form" class="rec-form" autocomplete="off" novalidate>
      <div class="suggest-head">
        <b id="changeTitle">Suggest a change</b>
        <button type="button" class="suggest-close" id="change-close" aria-label="Close">×</button>
      </div>
      <div class="rec-types" role="tablist" aria-label="Change type">
        <button type="button" class="rec-type on" data-action="edit">Update</button>
        <button type="button" class="rec-type" data-action="delete">Delete/Protest</button>
      </div>
      <p id="change-meta" class="rec-meta"></p>
      <div class="rec-edit-only">
        <div class="rec-form-grid">
          <label class="rec-field"><span>Time</span><input name="time" placeholder="1:23.456" inputmode="decimal"></label>
          <label class="rec-field"><span>Lap date</span><input name="date" type="date"></label>
        </div>
        <label class="rec-field"><span>Timing device</span><select name="timingDevice"></select></label>
        <label class="rec-field"><span>Evidence (optional)</span><input name="evidence" type="url" placeholder="https://" maxlength="300"></label>
        <div class="rec-ymm">
          <label class="rec-field rec-year"><span>Year</span><input name="vehicleYear" inputmode="numeric" maxlength="4" size="4"></label>
          <label class="rec-field"><span>Make</span><input name="vehicleMake" maxlength="40"></label>
          <label class="rec-field"><span>Model</span><input name="vehicleModel" maxlength="60"></label>
        </div>
      </div>
      <label class="rec-field"><span id="change-note-label">Note to reviewer (optional)</span><textarea name="note" id="change-note" maxlength="300" rows="2"></textarea></label>
      <div class="rec-form-actions">
        <button type="button" class="rec-cancel" id="change-cancel">Cancel</button>
        <button type="submit" class="rec-submit">Submit for Review</button>
      </div>
      <div id="changeMessage" class="rec-form-msg" hidden></div>
    </form>
  </dialog>

  <script src="js/lap-record-shared.js" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" integrity="sha256-v0oiNSTkC3fDBL7GfhIiz1UfFIgM9Cxp3ARlWOEcB7E=" crossorigin="anonymous"></script>
  <script src="js/records-charts.js" type="text/javascript"></script>
  <script src="js/records.js" type="text/javascript"></script>
</body>
</html>
