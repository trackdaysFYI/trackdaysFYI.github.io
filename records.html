<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lap records from trackdays.fyi">
  <title>Lap Records - Trackdays.fyi</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: rgb(57, 115, 172);
      --muted: rgb(176, 176, 176);
      --line: rgb(100, 100, 100);
      --soft: rgb(220, 220, 220);
      font-family: "Noto Sans", sans-serif;
      line-height: 1.35;
      color: rgb(255, 255, 255);
      background-color: rgb(34, 38, 42);
    }
    * {box-sizing: border-box;}
    body {margin: 0;}
    a {color: var(--accent);}
    header {display: flex; align-items: center; gap: 1.25rem; padding: 1.1rem 1.25rem 0.4rem;}
    a.brand {display: flex; align-items: center; gap: 0.55rem; color: var(--muted); text-decoration: none; font-size: 1.7rem; font-weight: 500; line-height: 1;}
    a.brand:hover {color: white;}
    a.brand svg {display: block; height: auto;}
    a.brand b {font-weight: 650; color: var(--soft);}
    h1 {margin: 0; font-size: 1.15rem; font-weight: 500; color: var(--muted);}
    .filters {display: flex; flex-wrap: wrap; gap: 0.75rem 1rem; align-items: end; padding: 0.6rem 1.25rem 0.9rem;}
    label {display: flex; flex-direction: column; gap: 0.25rem; min-width: 9rem; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);}
    label.search {flex: 1 1 14rem;}
    input, select {width: 100%; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--soft); font: inherit; font-size: 0.9rem; letter-spacing: 0; text-transform: none; padding: 0.4rem 0.8rem;}
    input:focus, select:focus {outline: 2px solid var(--accent); outline-offset: 2px;}
    select option {color: #1c2733;}
    .status {margin: 0; color: var(--muted); font-size: 0.85rem;}
    .status.err {color: #e07a6a;}
    .results-bar {display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0 1.25rem 0.6rem;}
    .view-switch {display: flex; gap: 4px;}
    .view-switch button {border: 0; border-radius: 999px; padding: 0.25rem 0.7rem; font: inherit; font-size: 0.8rem; font-weight: 650; color: var(--muted); background: transparent; cursor: pointer;}
    .view-switch button.on {color: white; background: var(--accent);}
    .table-wrap {overflow: auto; max-height: calc(100vh - 11rem); padding: 0 1.25rem 1rem;}
    table {width: 100%; border-collapse: collapse; font-size: 0.92rem;}
    th, td {padding: 0.45rem 0.6rem; text-align: left; border-bottom: 1px solid rgb(54, 58, 64); white-space: nowrap;}
    th {position: sticky; top: 0; z-index: 1; background: rgb(34, 38, 42); color: var(--muted); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 650;}
    th[hidden] {display: none;}
    td.time {font-variant-numeric: tabular-nums;}
    td.vehicle {white-space: normal; min-width: 10rem;}
    tr.group td {padding-top: 0.9rem; border-bottom-color: transparent; color: var(--soft); font-size: 0.72rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase;}
    .empty {padding: 1.5rem 0.6rem; color: var(--muted); text-align: center;}
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html">
      <svg xmlns="http://www.w3.org/2000/svg" width="56" fill="#ff0000" fill-opacity="1.0" viewBox="0 162.7 950 624.6">

    <h1>Lap Records</h1>
  </header>
  <div class="filters">
    <label>Track
      <select id="track"></select>
    </label>
    <label class="search">Search
      <input id="name" type="search" placeholder="Holder or vehicle" autocomplete="off">
    </label>
    <label>Vehicle
      <select id="vehicle">
        <option value="">All</option>
        <option value="C">Car</option>
        <option value="M">Moto</option>
        <option value="S">Sumo</option>
      </select>
    </label>
    <label>Class
      <select id="class"></select>
    </label>
    <label>Subtrack
      <select id="subtrack"></select>
    </label>
  </div>
  <div class="results-bar">
    <p id="status" class="status">Loading lap records...</p>
    <div class="view-switch" role="group" aria-label="Arrange records">
      <button type="button" id="view-class" class="on">Class</button>
      <button type="button" id="view-time">Time</button>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Track</th>
          <th>Subtrack</th>
          <th>Vehicle</th>
          <th id="class-col">Class</th>
          <th>Holder</th>
          <th>Date</th>
          <th>Evidence</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <script>
    const RECORDS_URL = "https://8fu4ilcse5.execute-api.us-east-1.amazonaws.com/getLapRecords";
    const TRACKS_URL = "https://37lke1xhn3.execute-api.us-east-1.amazonaws.com/getTrackdaysTest";
    const VEHICLE_LABELS = {C: "Car", M: "Moto", S: "Sumo"};
    const LAP_TIME_RE = /^(?:\d{1,3}:[0-5]\d|[0-5]?\d)\.\d{1,3}$/;

    let records = [];
    let trackNames = {};
    let viewMode = "class";
    const trackSelect = document.getElementById("track");
    const nameInput = document.getElementById("name");
    const vehicleSelect = document.getElementById("vehicle");
    const classSelect = document.getElementById("class");
    const subtrackSelect = document.getElementById("subtrack");
    const classCol = document.getElementById("class-col");
    const viewClassButton = document.getElementById("view-class");
    const viewTimeButton = document.getElementById("view-time");
    const statusEl = document.getElementById("status");
    const rowsEl = document.getElementById("rows");

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[ch]));
    }

    function safeHttpUrl(value) {
      try {
        let url = new URL(String(value));
        if (url.protocol !== "http:" && url.protocol !== "https:") return "";
        return url.href;
      } catch (e) {
        return "";
      }
    }

    function timeToMs(time) {
      let text = String(time).trim();
      if (!LAP_TIME_RE.test(text)) return Number.MAX_SAFE_INTEGER;
      let colon = text.indexOf(":");
      let minutes = 0;
      let seconds = text;
      if (colon !== -1) {
        minutes = Number(text.slice(0, colon));
        seconds = text.slice(colon + 1);
      }
      return minutes * 60000 + Number(seconds) * 1000;
    }

    function trackKey() {
      return trackSelect.value;
    }

    function trackLabel(key) {
      return trackNames[key] || key;
    }

    function scopedRecords() {
      let vehicle = vehicleSelect.value;
      let track = trackKey();
      return records.filter(record => {
        if (track && String(record.track).toUpperCase() !== track) return false;
        if (vehicle && record.vehicleType !== vehicle) return false;
        return true;
      });
    }

    function fillSelect(select, values, allLabel) {
      let current = select.value;
      let options = values.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("");
      select.innerHTML = `<option value="">${escapeHtml(allLabel)}</option>${options}`;
      select.value = values.includes(current) ? current : "";
    }

    function fillTrackSelect() {
      let current = trackKey() || (new URLSearchParams(location.search).get("track") || "").trim().toUpperCase();
      let keys = [...new Set(records.map(record => String(record.track).toUpperCase()))];
      if (current && !keys.includes(current)) keys.push(current);
      keys.sort((a, b) => trackLabel(a).localeCompare(trackLabel(b)) || a.localeCompare(b));
      let options = keys.map(key => `<option value="${escapeHtml(key)}">${escapeHtml(trackLabel(key))}</option>`).join("");
      trackSelect.innerHTML = `<option value="">All tracks</option>${options}`;
      trackSelect.value = keys.includes(current) ? current : "";
    }

    function fillDependentSelects() {
      let scoped = scopedRecords();
      let classes = [...new Set(scoped.map(record => record.vehicleClass || "").filter(Boolean))].sort((a, b) => a.localeCompare(b));
      let subtracks = [...new Set(scoped.map(record => record.subtrack || "").filter(Boolean))].sort((a, b) => a.localeCompare(b));
      fillSelect(classSelect, classes, "All classes");
      fillSelect(subtrackSelect, subtracks, "All subtracks");
    }

    function filteredRecords() {
      let query = nameInput.value.trim().toLowerCase();
      let vehicleClass = classSelect.value;
      let subtrack = subtrackSelect.value;
      return scopedRecords().filter(record => {
        if (vehicleClass && (record.vehicleClass || "") !== vehicleClass) return false;
        if (subtrack && (record.subtrack || "") !== subtrack) return false;
        if (!query) return true;
        let name = [record.holder, record.vehicleYear, record.vehicleMake, record.vehicleModel].join(" ").toLowerCase();
        return name.includes(query);
      });
    }

    function setTrackParam(track) {
      let url = new URL(location.href);
      if (track) url.searchParams.set("track", track);
      else url.searchParams.delete("track");
      history.replaceState(null, "", url);
    }

    function compareRecords(a, b) {
      let byTime = timeToMs(a.time) - timeToMs(b.time);
      if (byTime !== 0) return byTime;
      return trackLabel(a.track).localeCompare(trackLabel(b.track)) || String(a.vehicleClass).localeCompare(String(b.vehicleClass));
    }

    function recordRow(record, includeClass) {
      let detail = [record.vehicleYear, record.vehicleMake, record.vehicleModel].filter(value => value != null && value !== "").join(" ");
      let type = VEHICLE_LABELS[record.vehicleType] || record.vehicleType || "";
      let vehicle = [type, detail].filter(Boolean).join(" · ");
      let evidence = safeHttpUrl(record.evidence);
      let evidenceCell = evidence ? `<a href="${escapeHtml(evidence)}" target="_blank" rel="noopener">View</a>` : "";
      let classCell = includeClass ? `<td>${escapeHtml(record.vehicleClass || "")}</td>` : "";
      return `<tr>
        <td class="time">${escapeHtml(record.time || "")}</td>
        <td>${escapeHtml(trackLabel(record.track))}</td>
        <td>${escapeHtml(record.subtrack || "")}</td>
        <td class="vehicle">${escapeHtml(vehicle)}</td>
        ${classCell}
        <td>${escapeHtml(record.holder || "")}</td>
        <td>${escapeHtml(record.date || "")}</td>
        <td>${evidenceCell}</td>
      </tr>`;
    }

    function classGroups(shown) {
      let groups = new Map();
      shown.forEach(record => {
        let key = `${record.vehicleType || ""}\0${record.vehicleClass || ""}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(record);
      });
      return [...groups.entries()].sort((a, b) => {
        let best = rows => Math.min(...rows.map(record => timeToMs(record.time)));
        let byTime = best(a[1]) - best(b[1]);
        if (byTime !== 0) return byTime;
        return a[0].localeCompare(b[0]);
      });
    }

    function renderRows() {
      let shown = filteredRecords();
      let byClass = viewMode === "class";
      classCol.hidden = byClass;
      let colspan = byClass ? 7 : 8;
      statusEl.className = "status";
      statusEl.textContent = `${shown.length} record${shown.length === 1 ? "" : "s"}`;
      if (!shown.length) {
        rowsEl.innerHTML = `<tr><td class="empty" colspan="${colspan}">No records match</td></tr>`;
        return;
      }
      if (!byClass) {
        rowsEl.innerHTML = shown.sort(compareRecords).map(record => recordRow(record, true)).join("");
        return;
      }
      let showType = new Set(shown.map(record => record.vehicleType)).size > 1;
      rowsEl.innerHTML = classGroups(shown).map(([key, rows]) => {
        let [typeCode, className] = key.split("\0");
        let type = VEHICLE_LABELS[typeCode] || typeCode || "";
        let label = showType && type ? [type, className].filter(Boolean).join(" · ") : (className || type);
        let head = `<tr class="group"><td colspan="${colspan}">${escapeHtml(label)}</td></tr>`;
        return head + rows.sort(compareRecords).map(record => recordRow(record, false)).join("");
      }).join("");
    }

    function render() {
      fillTrackSelect();
      fillDependentSelects();
      renderRows();
    }

    trackSelect.addEventListener("change", () => {
      setTrackParam(trackSelect.value);
      fillDependentSelects();
      renderRows();
    });
    vehicleSelect.addEventListener("change", () => {
      fillDependentSelects();
      renderRows();
    });
    classSelect.addEventListener("change", renderRows);
    subtrackSelect.addEventListener("change", renderRows);
    nameInput.addEventListener("input", renderRows);
    function setView(mode) {
      viewMode = mode;
      viewClassButton.classList.toggle("on", mode === "class");
      viewTimeButton.classList.toggle("on", mode === "time");
      renderRows();
    }
    viewClassButton.addEventListener("click", () => setView("class"));
    viewTimeButton.addEventListener("click", () => setView("time"));

    function showError(message) {
      statusEl.className = "status err";
      statusEl.textContent = message;
      rowsEl.innerHTML = "";
    }

    async function loadPage() {
      let recordsResult;
      let tracksResult;
      try {
        recordsResult = await fetch(RECORDS_URL);
        if (!recordsResult.ok) throw new Error("HTTP " + recordsResult.status);
        records = await recordsResult.json();
        if (!Array.isArray(records)) throw new Error("Unable to load lap records.");
      } catch (err) {
        records = [];
        showError(err && err.message && err.message.startsWith("HTTP ") ? err.message : "Unable to load lap records.");
        return;
      }
      try {
        tracksResult = await fetch(TRACKS_URL);
        if (tracksResult.ok) {
          let data = await tracksResult.json();
          (data.tracks || []).forEach(track => {
            if (!track.nickname) return;
            trackNames[String(track.nickname).toUpperCase()] = track.name || track.nickname;
          });
        }
      } catch (err) {
        trackNames = {};
      }
      render();
    }

    loadPage();
  </script>
</body>
