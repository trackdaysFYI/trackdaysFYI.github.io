<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lap records from trackdays.fyi">
  <title>Lap Records · Scoreboard - Trackdays.fyi</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {

      --accent: rgb(57, 115, 172);
      --muted: rgb(176, 176, 176);
      --line: rgb(100, 100, 100);
      --soft: rgb(220, 220, 220);
      --bg: rgb(34, 38, 42);
      --text: rgb(255, 255, 255);
      --title: var(--soft);
      --time: var(--soft);
      --link: var(--accent);
      --eyebrow: var(--accent);
      --group: var(--accent);
      --glow: rgba(57,115,172,0.28);
      --panel-border: rgb(54, 58, 64);
      --panel-bg: rgba(0,0,0,0.2);
      --input-border: var(--line);
      --input-bg: rgba(255,255,255,0.03);
      --focus: var(--accent);
      --err: #e07a6a;
      --switch-bg: rgba(0,0,0,0.28);
      --on-text: white;
      --on-bg: var(--accent);
      --table-bg: rgba(0,0,0,0.18);
      --row-line: rgb(54, 58, 64);
      --th-bg: rgb(30, 34, 38);
      --hover: rgba(57,115,172,0.08);
      --group-bg: rgba(57,115,172,0.08);
      --logo-opacity: 1;

    --page-gutter: clamp(0.85rem, 3.5vw, 3.5rem);
    font-family: "DM Sans", sans-serif;
    line-height: 1.35;
    color: var(--text);
    background-color: var(--bg);
  }
  * {box-sizing: border-box;}
  body {
    margin: 0;
    padding: 0 var(--page-gutter) 2rem;
    background:
      radial-gradient(ellipse 70% 40% at 50% -10%, var(--glow), transparent 60%),
      var(--bg);
  }
  a {color: var(--link);}
  .shell {max-width: 72rem; margin: 0 auto;}
  header {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 0.85rem 1.5rem; padding: 1.4rem 0 1rem;
  }
  a.brand {display: flex; align-items: center; gap: 0.55rem; color: var(--muted); text-decoration: none; font-size: 1.15rem; font-weight: 500; line-height: 1;}
  a.brand svg {display: block; width: 44px; height: auto; opacity: var(--logo-opacity);}
  a.brand b {font-weight: 700; color: inherit;}
  .title-block {text-align: right;}
  .eyebrow {margin: 0 0 0.2rem; font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--eyebrow);}
  h1 {
    margin: 0; font-family: "Space Grotesk", sans-serif; font-size: clamp(1.7rem, 6vw, 3.2rem);
    font-weight: 700; letter-spacing: -0.04em; color: var(--title); line-height: 0.95;
  }
  .filters {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); gap: 0.65rem;
    padding: 0.85rem; margin-bottom: 1rem;
    border: 1px solid var(--panel-border); border-radius: 14px;
    background: var(--panel-bg);
  }
  label {display: flex; flex-direction: column; gap: 0.25rem; min-width: 0; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);}
  label.search {grid-column: 1 / -1;}
  input, select {
    width: 100%; min-height: 2.6rem; border: 1px solid var(--input-border); border-radius: 10px;
    background: var(--input-bg); color: var(--soft); font: inherit; font-size: 1rem;
    letter-spacing: 0; text-transform: none; padding: 0.5rem 0.75rem;
  }
  input:focus, select:focus {outline: 2px solid var(--focus); outline-offset: 1px;}
  select option {color: #1c2733;}
  .results-bar {display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.55rem;}
  .status {margin: 0; color: var(--muted); font-size: 0.85rem;}
  .status.err {color: var(--err);}
  .view-switch {display: flex; flex: 0 0 auto; gap: 0.35rem; padding: 0.2rem; border-radius: 999px; background: var(--switch-bg);}
  .view-switch button {border: 0; border-radius: 999px; min-height: 2.2rem; padding: 0.35rem 0.9rem; font: inherit; font-size: 0.8rem; font-weight: 700; color: var(--muted); background: transparent; cursor: pointer;}
  .view-switch button.on {color: var(--on-text); background: var(--on-bg);}
  .table-wrap {
    overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    max-height: calc(100vh - 16rem); border: 1px solid var(--panel-border);
    border-radius: 14px; background: var(--table-bg);
  }
  table {width: 100%; min-width: 40rem; border-collapse: collapse; font-size: 0.9rem;}
  th, td {padding: 0.55rem 0.8rem; text-align: left; border-bottom: 1px solid var(--row-line); white-space: nowrap;}
  th {position: sticky; top: 0; z-index: 1; background: var(--th-bg); color: var(--muted); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700;}
  th:first-child, td.time {padding-left: 1rem;}
  th[hidden] {display: none;}
  td.time {
    font-family: "Space Grotesk", sans-serif; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--time); font-size: 1.02rem;
  }
  td.time .gap {margin-left: 0.45rem; color: var(--muted); font-size: 0.78rem; font-weight: 500;}
  td.vehicle {white-space: normal; min-width: 10rem;}
  @media (hover: hover) {
    tbody tr:hover td {background: var(--hover);}
  }
  tr.group td {
    padding-top: 0.95rem; border-bottom-color: transparent; color: var(--group);
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    background: var(--group-bg);
  }
  .empty {padding: 2rem 0.6rem; color: var(--muted); text-align: center;}
  .loading {display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.9rem; min-height: calc(100vh - 4rem); color: var(--muted); font-size: 0.95rem; text-align: center;}
  .loading-bar {width: 7.5rem; height: 2px; border-radius: 999px; background: var(--line); overflow: hidden;}
  .loading-bar::before {content: ""; display: block; width: 40%; height: 100%; border-radius: inherit; background: var(--accent); animation: loading-slide 1.1s ease-in-out infinite;}
  .loading.err {color: var(--err);}
  .loading.err .loading-bar {display: none;}
  .loading[hidden], #content[hidden] {display: none;}
  #content {animation: records-in 220ms ease;}
  @keyframes loading-slide {from {transform: translateX(-120%);} to {transform: translateX(280%);}}
  @keyframes records-in {from {opacity: 0; transform: translateY(6px);} to {opacity: 1; transform: none;}}
  @media (max-width: 720px) {
    header {flex-direction: column; align-items: flex-start;}
    .title-block {text-align: left;}
    .filters {padding: 0.75rem; border-radius: 12px;}
    .table-wrap {max-height: none; border-radius: 12px;}
    table {font-size: 0.84rem;}
    th, td {padding: 0.5rem 0.65rem;}
  }
  @media (prefers-reduced-motion: reduce) {
    #content {animation: none;}
    .loading-bar::before {animation: none; width: 100%; transform: none; opacity: 0.65;}
  }

  </style>

</head>

  <script>
    const RECORDS_URL = "https://8fu4ilcse5.execute-api.us-east-1.amazonaws.com/getLapRecords";
    const TRACKS_URL = "https://atqtpmna66.execute-api.us-east-1.amazonaws.com/getTrackdays?include=tracks";
    const VEHICLE_LABELS = {C: "Car", M: "Moto", S: "Sumo"};
    const LAP_TIME_RE = /^(?:\d{1,3}:[0-5]\d|[0-5]?\d)\.\d{1,3}$/;

    let records = [];
    let trackNames = {};
    let trackSubtracks = {};
    let viewMode = "class";
    let paramsApplied = false;
    const trackSelect = document.getElementById("track");
    const nameInput = document.getElementById("name");
    const vehicleSelect = document.getElementById("vehicle");
    const classSelect = document.getElementById("class");
    const subtrackSelect = document.getElementById("subtrack");
    const subtrackFilter = document.getElementById("subtrack-filter");
    const subtrackCol = document.getElementById("subtrack-col");
    const classCol = document.getElementById("class-col");
    const viewClassButton = document.getElementById("view-class");
    const viewTimeButton = document.getElementById("view-time");
    const statusEl = document.getElementById("status");
    const rowsEl = document.getElementById("rows");
    const loadingEl = document.getElementById("loading");
    const contentEl = document.getElementById("content");

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[ch]));
    }

    function safeHttpUrl(value) {
      try {
        let url = new URL(String(value));
        if (url.protocol !== "http:" && url.protocol !== "https:") return "";
        return url.href;
      } catch (e) {
        return "";
      }
    }

    function timeToMs(time) {
      let text = String(time).trim();
      if (!LAP_TIME_RE.test(text)) return Number.MAX_SAFE_INTEGER;
      let colon = text.indexOf(":");
      let minutes = 0;
      let seconds = text;
      if (colon !== -1) {
        minutes = Number(text.slice(0, colon));
        seconds = text.slice(colon + 1);
      }
      return minutes * 60000 + Number(seconds) * 1000;
    }

    function trackKey() {
      return trackSelect.value;
    }

    function trackLabel(key) {
      return trackNames[key] || key;
    }

    function scopedRecords() {
      let vehicle = vehicleSelect.value;
      let track = trackKey();
      return records.filter(record => {
        if (track && String(record.track).toUpperCase() !== track) return false;
        if (vehicle && record.vehicleType !== vehicle) return false;
        return true;
      });
    }

    function trackHasSubtracks(key) {
      if (key) {
        if (Object.prototype.hasOwnProperty.call(trackSubtracks, key)) return trackSubtracks[key].length > 0;
        return records.some(record => String(record.track).toUpperCase() === key && record.subtrack);
      }
      if (Object.keys(trackSubtracks).some(name => trackSubtracks[name].length)) return true;
      return records.some(record => record.subtrack);
    }

    function showSubtracks() {
      return trackHasSubtracks(trackKey());
    }

    function syncSubtrackVisibility() {
      let show = showSubtracks();
      subtrackFilter.hidden = !show;
      subtrackCol.hidden = !show;
      if (!show) subtrackSelect.value = "";
      return show;
    }

    function fillSelect(select, values, allLabel) {
      let current = select.value;
      let options = values.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("");
      select.innerHTML = `<option value="">${escapeHtml(allLabel)}</option>${options}`;
      select.value = values.includes(current) ? current : "";
    }

    function fillTrackSelect() {
      let current = trackKey() || (new URLSearchParams(location.search).get("track") || "").trim().toUpperCase();
      let keys = [...new Set(records.map(record => String(record.track).toUpperCase()))];
      if (current && !keys.includes(current)) keys.push(current);
      keys.sort((a, b) => trackLabel(a).localeCompare(trackLabel(b)) || a.localeCompare(b));
      let options = keys.map(key => `<option value="${escapeHtml(key)}">${escapeHtml(trackLabel(key))}</option>`).join("");
      trackSelect.innerHTML = `<option value="">All tracks</option>${options}`;
      trackSelect.value = keys.includes(current) ? current : "";
    }

    function fillDependentSelects() {
      let scoped = scopedRecords();
      let classes = [...new Set(scoped.map(record => record.vehicleClass || "").filter(Boolean))].sort((a, b) => a.localeCompare(b));
      let subtracks = [...new Set(scoped.map(record => record.subtrack || "").filter(Boolean))].sort((a, b) => a.localeCompare(b));
      fillSelect(classSelect, classes, "All classes");
      fillSelect(subtrackSelect, subtracks, "All subtracks");
      syncSubtrackVisibility();
    }

    function filteredRecords() {
      let terms = nameInput.value.toLowerCase().split(",").map(term => term.trim()).filter(Boolean);
      let vehicleClass = classSelect.value;
      let subtrack = subtrackSelect.value;
      return scopedRecords().filter(record => {
        if (vehicleClass && (record.vehicleClass || "") !== vehicleClass) return false;
        if (subtrack && (record.subtrack || "") !== subtrack) return false;
        if (!terms.length) return true;
        let name = [record.holder, record.vehicleYear, record.vehicleMake, record.vehicleModel].join(" ").toLowerCase();
        return terms.some(term => name.includes(term));
      });
    }

    function syncParams() {
      let url = new URL(location.href);
      let set = (key, value) => {
        if (value) url.searchParams.set(key, value);
        else url.searchParams.delete(key);
      };
      set("track", trackSelect.value);
      set("vehicle", vehicleSelect.value);
      set("class", classSelect.value);
      set("subtrack", subtrackSelect.value);
      set("q", nameInput.value.trim());
      set("view", viewMode === "time" ? "time" : "class");
      history.replaceState(null, "", url);
    }

    function applyParams() {
      let params = new URLSearchParams(location.search);
      let vehicle = params.get("vehicle") || "";
      if ([...vehicleSelect.options].some(option => option.value === vehicle)) vehicleSelect.value = vehicle;
      nameInput.value = params.get("q") || "";
      viewMode = params.get("view") === "time" ? "time" : "class";
      viewClassButton.classList.toggle("on", viewMode === "class");
      viewTimeButton.classList.toggle("on", viewMode === "time");
    }

    function applyDependentParams() {
      let params = new URLSearchParams(location.search);
      let vehicleClass = params.get("class") || "";
      let subtrack = params.get("subtrack") || "";
      if ([...classSelect.options].some(option => option.value === vehicleClass)) classSelect.value = vehicleClass;
      if ([...subtrackSelect.options].some(option => option.value === subtrack)) subtrackSelect.value = subtrack;
    }

    function compareRecords(a, b) {
      let byTime = timeToMs(a.time) - timeToMs(b.time);
      if (byTime !== 0) return byTime;
      return trackLabel(a.track).localeCompare(trackLabel(b.track)) || String(a.vehicleClass).localeCompare(String(b.vehicleClass));
    }

    function formatGap(ms) {
      ms = Math.round(ms);
      let minutes = Math.floor(ms / 60000);
      let seconds = ((ms % 60000) / 1000).toFixed(3);
      if (!minutes) return `+${seconds}`;
      let [whole, frac] = seconds.split(".");
      return `+${minutes}:${whole.padStart(2, "0")}.${frac}`;
    }

    function recordRow(record, includeClass, includeSubtrack, gapMs) {
      let detail = [record.vehicleYear, record.vehicleMake, record.vehicleModel].filter(value => value != null && value !== "").join(" ");
      let type = VEHICLE_LABELS[record.vehicleType] || record.vehicleType || "";
      let vehicle = [type, detail].filter(Boolean).join(" · ");
      let evidence = safeHttpUrl(record.evidence);
      let evidenceCell = evidence ? `<a href="${escapeHtml(evidence)}" target="_blank" rel="noopener">View</a>` : "";
      let classCell = includeClass ? `<td>${escapeHtml(record.vehicleClass || "")}</td>` : "";
      let subCell = includeSubtrack ? `<td>${escapeHtml(record.subtrack || "")}</td>` : "";
      let gap = gapMs == null ? "" : ` <span class="gap">${formatGap(gapMs)}</span>`;
      return `<tr>
        <td class="time">${escapeHtml(record.time || "")}${gap}</td>
        <td>${escapeHtml(trackLabel(record.track))}</td>
        ${subCell}
        <td class="vehicle">${escapeHtml(vehicle)}</td>
        ${classCell}
        <td>${escapeHtml(record.holder || "")}</td>
        <td>${escapeHtml(record.date || "")}</td>
        <td>${evidenceCell}</td>
      </tr>`;
    }

    function classGroups(shown) {
      let groups = new Map();
      shown.forEach(record => {
        let key = [
          String(record.track || "").toUpperCase(),
          record.subtrack || "",
          record.vehicleType || "",
          record.vehicleClass || "",
        ].join("\0");
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(record);
      });
      return [...groups.entries()].sort((a, b) => {
        let best = rows => Math.min(...rows.map(record => timeToMs(record.time)));
        let byTime = best(a[1]) - best(b[1]);
        if (byTime !== 0) return byTime;
        return a[0].localeCompare(b[0]);
      });
    }

    function groupLabel(key, flags) {
      let [track, subtrack, typeCode, className] = key.split("\0");
      let type = VEHICLE_LABELS[typeCode] || typeCode || "";
      let parts = [];
      if (flags.track) parts.push(trackLabel(track));
      if (flags.type && type) parts.push(type);
      if (className) parts.push(className);
      else if (!(flags.type && type)) parts.push(type);
      if (flags.subtrack && subtrack) parts.push(subtrack);
      return parts.filter(Boolean).join(" · ");
    }

    function renderRows() {
      let shown = filteredRecords();
      let byClass = viewMode === "class";
      let includeSubtrack = syncSubtrackVisibility();
      classCol.hidden = byClass;
      let colspan = 8 - (byClass ? 1 : 0) - (includeSubtrack ? 0 : 1);
      statusEl.className = "status";
      statusEl.textContent = `${shown.length} record${shown.length === 1 ? "" : "s"}`;
      if (!shown.length) {
        rowsEl.innerHTML = `<tr><td class="empty" colspan="${colspan}">No records match</td></tr>`;
        return;
      }
      if (!byClass) {
        rowsEl.innerHTML = shown.sort(compareRecords).map(record => recordRow(record, true, includeSubtrack)).join("");
        return;
      }
      let flags = {
        track: new Set(shown.map(record => String(record.track || "").toUpperCase())).size > 1,
        type: new Set(shown.map(record => record.vehicleType)).size > 1,
        subtrack: includeSubtrack && new Set(shown.map(record => record.subtrack || "")).size > 1,
      };
      rowsEl.innerHTML = classGroups(shown).map(([key, rows]) => {
        let label = groupLabel(key, flags);
        let head = `<tr class="group"><td colspan="${colspan}">${escapeHtml(label)}</td></tr>`;
        rows.sort(compareRecords);
        let best = timeToMs(rows[0].time);
        return head + rows.map((record, index) => {
          let ms = timeToMs(record.time);
          let gap = index === 0 || ms === Number.MAX_SAFE_INTEGER || best === Number.MAX_SAFE_INTEGER ? null : ms - best;
          return recordRow(record, false, includeSubtrack, gap);
        }).join("");
      }).join("");
    }

    function render() {
      if (!paramsApplied) applyParams();
      fillTrackSelect();
      fillDependentSelects();
      if (!paramsApplied) {
        applyDependentParams();
        paramsApplied = true;
      }
      renderRows();
    }

    trackSelect.addEventListener("change", () => {
      fillDependentSelects();
      syncParams();
      renderRows();
    });
    vehicleSelect.addEventListener("change", () => {
      fillDependentSelects();
      syncParams();
      renderRows();
    });
    classSelect.addEventListener("change", () => {
      syncParams();
      renderRows();
    });
    subtrackSelect.addEventListener("change", () => {
      syncParams();
      renderRows();
    });
    nameInput.addEventListener("input", () => {
      syncParams();
      renderRows();
    });
    function setView(mode) {
      viewMode = mode;
      viewClassButton.classList.toggle("on", mode === "class");
      viewTimeButton.classList.toggle("on", mode === "time");
      syncParams();
      renderRows();
    }
    viewClassButton.addEventListener("click", () => setView("class"));
    viewTimeButton.addEventListener("click", () => setView("time"));

    function showResults() {
      loadingEl.hidden = true;
      contentEl.hidden = false;
    }

    function showError(message) {
      statusEl.className = "status err";
      statusEl.textContent = message;
      rowsEl.innerHTML = "";
      loadingEl.classList.add("err");
      loadingEl.querySelector("p").textContent = message;
    }

    async function loadPage() {
      let recordsResult;
      let tracksResult;
      try {
        recordsResult = await fetch(RECORDS_URL);
        if (!recordsResult.ok) throw new Error("HTTP " + recordsResult.status);
        records = await recordsResult.json();
        if (!Array.isArray(records)) throw new Error("Unable to load lap records.");
      } catch (err) {
        records = [];
        showError(err && err.message && err.message.startsWith("HTTP ") ? err.message : "Unable to load lap records.");
        return;
      }
      try {
        tracksResult = await fetch(TRACKS_URL);
        if (tracksResult.ok) {
          let data = await tracksResult.json();
          (data.tracks || []).forEach(track => {
            if (!track.nickname) return;
            let key = String(track.nickname).toUpperCase();
            trackNames[key] = track.name || track.nickname;
            trackSubtracks[key] = Array.isArray(track.subtracks)
              ? track.subtracks.map(name => String(name || "").trim()).filter(Boolean)
              : [];
          });
        }
      } catch (err) {
        trackNames = {};
        trackSubtracks = {};
      }
      render();
      showResults();
    }

    loadPage();
  </script>
</body>
</html>
