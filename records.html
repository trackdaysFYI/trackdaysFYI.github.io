<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lap records from trackdays.fyi">
  <title>Lap Records - Trackdays.fyi</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {

      --accent: rgb(57, 115, 172);
      --muted: rgb(176, 176, 176);
      --line: rgb(100, 100, 100);
      --soft: rgb(220, 220, 220);
      --bg: rgb(34, 38, 42);
      --text: rgb(255, 255, 255);
      --title: var(--soft);
      --time: var(--soft);
      --link: var(--accent);
      --eyebrow: var(--accent);
      --group: var(--accent);
      --glow: rgba(57,115,172,0.28);
      --panel-border: rgb(54, 58, 64);
      --panel-bg: rgba(0,0,0,0.2);
      --input-border: var(--line);
      --input-bg: rgba(255,255,255,0.03);
      --focus: var(--accent);
      --err: #e07a6a;
      --switch-bg: rgba(0,0,0,0.28);
      --on-text: white;
      --on-bg: var(--accent);
      --table-bg: rgba(0,0,0,0.18);
      --row-line: rgb(54, 58, 64);
      --th-bg: rgb(30, 34, 38);
      --hover: rgba(57,115,172,0.08);
      --group-bg: rgba(57,115,172,0.08);
      --logo-opacity: 1;

    --page-gutter: clamp(0.85rem, 3.5vw, 3.5rem);
    font-family: "DM Sans", sans-serif;
    line-height: 1.35;
    color: var(--text);
    background-color: var(--bg);
  }
  * {box-sizing: border-box;}
  body {
    margin: 0;
    padding: 0 var(--page-gutter) 2rem;
    background:
      radial-gradient(ellipse 70% 40% at 50% -10%, var(--glow), transparent 60%),
      var(--bg);
  }
  a {color: var(--link);}
  .shell {max-width: 72rem; margin: 0 auto;}
  header {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 0.85rem 1.5rem; padding: 1.4rem 0 1rem;
  }
  a.brand {display: flex; align-items: center; gap: 0.65rem; color: var(--soft); text-decoration: none; font-size: clamp(1.55rem, 4vw, 2.15rem); font-weight: 500; line-height: 1;}
  a.brand svg {display: block; width: clamp(2.4rem, 6vw, 3.25rem); height: auto; opacity: var(--logo-opacity);}
  a.brand b {font-weight: 700; color: inherit;}
  .title-block {text-align: right;}
  h1 {
    margin: 0; font-family: "Space Grotesk", sans-serif; font-size: clamp(1.55rem, 4vw, 2.15rem);
    font-weight: 700; letter-spacing: -0.02em; color: var(--muted); line-height: 1;
  }
  .filters {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); gap: 0.65rem;
    padding: 0.85rem; margin-bottom: 1rem;
    border: 1px solid var(--panel-border); border-radius: 14px;
    background: var(--panel-bg);
  }
  label {display: flex; flex-direction: column; gap: 0.25rem; min-width: 0; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);}
  label[hidden] {display: none;}
  label.search {grid-column: 1 / -1;}
  label.track {grid-column: span 2; min-width: 16rem;}
  input, select {
    width: 100%; min-height: 2.6rem; border: 1px solid var(--input-border); border-radius: 10px;
    background: var(--input-bg); color: var(--soft); font: inherit; font-size: 1rem;
    letter-spacing: 0; text-transform: none; padding: 0.5rem 0.75rem;
  }
  input:focus, select:focus {outline: 2px solid var(--focus); outline-offset: 1px;}
  select option {color: #1c2733;}
  .results-bar {display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.55rem;}
  .status {margin: 0; color: var(--muted); font-size: 0.85rem;}
  .status.err {color: var(--err);}
  .export-actions {
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
    margin-top: 0.75rem;
  }
  .export-actions .export-buttons {display: flex; gap: 0.35rem;}
  .export-actions button {
    border: 1px solid var(--panel-border); border-radius: 10px; min-height: 2.2rem;
    padding: 0.35rem 0.85rem; font: inherit; font-size: 0.8rem; font-weight: 700;
    color: var(--soft); background: transparent; cursor: pointer;
  }
  .export-actions button:disabled {opacity: 0.45; cursor: default;}
  @media (hover: hover) {
    .export-actions button:not(:disabled):hover {border-color: var(--accent); color: var(--text);}
  }
  .view-switch {display: flex; flex: 0 0 auto; gap: 0.35rem; padding: 0.2rem; border-radius: 999px; background: var(--switch-bg);}
  .view-switch button {border: 0; border-radius: 999px; min-height: 2.2rem; padding: 0.35rem 0.9rem; font: inherit; font-size: 0.8rem; font-weight: 700; color: var(--muted); background: transparent; cursor: pointer;}
  .view-switch button.on {color: var(--on-text); background: var(--on-bg);}
  .table-wrap {
    overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    max-height: calc(100vh - 16rem); border: 1px solid var(--panel-border);
    border-radius: 14px; background: var(--table-bg);
  }
  table {width: 100%; min-width: 40rem; border-collapse: collapse; font-size: 0.9rem;}
  th, td {padding: 0.55rem 0.8rem; text-align: left; border-bottom: 1px solid var(--row-line); white-space: nowrap;}
  th {position: sticky; top: 0; z-index: 1; background: var(--th-bg); color: var(--muted); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700;}
  th:first-child, td.time {padding-left: 1rem;}
  th[hidden] {display: none;}
  td.time {
    font-family: "Space Grotesk", sans-serif; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--time); font-size: 1.02rem;
  }
  td.time .gap {margin-left: 0.45rem; color: var(--muted); font-size: 0.78rem; font-weight: 500;}
  td.vehicle {white-space: normal; min-width: 10rem;}
  tbody tr[data-key] {cursor: pointer;}
  tbody tr.ref td {background: rgba(57,115,172,0.16);}
  @media (hover: hover) {
    tbody tr:hover td {background: var(--hover);}
    tbody tr.ref:hover td {background: rgba(57,115,172,0.22);}
  }
  tr.group td {
    padding-top: 0.95rem; border-bottom-color: transparent; color: var(--group);
    font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    background: var(--group-bg);
  }
  .empty {padding: 2rem 0.6rem; color: var(--muted); text-align: center;}
  .loading {display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.9rem; min-height: calc(100vh - 4rem); color: var(--muted); font-size: 0.95rem; text-align: center;}
  .loading-bar {width: 7.5rem; height: 2px; border-radius: 999px; background: var(--line); overflow: hidden;}
  .loading-bar::before {content: ""; display: block; width: 40%; height: 100%; border-radius: inherit; background: var(--accent); animation: loading-slide 1.1s ease-in-out infinite;}
  .loading.err {color: var(--err);}
  .loading.err .loading-bar {display: none;}
  .loading[hidden], #content[hidden] {display: none;}
  #content {animation: records-in 220ms ease;}
  @keyframes loading-slide {from {transform: translateX(-120%);} to {transform: translateX(280%);}}
  @keyframes records-in {from {opacity: 0; transform: translateY(6px);} to {opacity: 1; transform: none;}}
  @media (max-width: 720px) {
    :root {--page-gutter: 0.75rem;}
    body {padding-bottom: max(1.25rem, env(safe-area-inset-bottom));}
    header {
      align-items: center; gap: 0.45rem 0.85rem; padding: 0.95rem 0 0.75rem;
    }
    a.brand {font-size: 1.2rem; gap: 0.45rem;}
    a.brand svg {width: 1.85rem;}
    h1 {font-size: 1.2rem;}
    .filters {
      grid-template-columns: repeat(3, 1fr); gap: 0.55rem;
      padding: 0.7rem; margin-bottom: 0.75rem; border-radius: 12px;
    }
    label.track {min-width: 0;}
    input, select {
      min-height: 2.75rem; font-size: 16px; border-radius: 8px;
    }
    .results-bar {flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.45rem;}
    .status {font-size: 0.8rem;}
    .view-switch button {min-height: 2.4rem; padding: 0.35rem 0.85rem;}
    .table-wrap {
      max-height: none; margin-inline: calc(-1 * var(--page-gutter));
      border-radius: 0; border-left: 0; border-right: 0;
    }
    table {font-size: 0.82rem; min-width: 30rem;}
    th, td {padding: 0.45rem 0.55rem;}
    th:first-child, td.time {
      position: sticky; left: 0; padding-left: 0.75rem;
      box-shadow: 6px 0 10px -8px rgba(0,0,0,0.55);
    }
    th:first-child {z-index: 2;}
    th:last-child, td:last-child {padding-right: 0.75rem;}
    td.time {
      z-index: 1; font-size: 0.95rem; background: var(--bg);
    }
    /* Opaque sticky bg so horizontally scrolled cells do not show through */
    tbody tr.ref td.time {
      background:
        linear-gradient(rgba(57, 115, 172, 0.16), rgba(57, 115, 172, 0.16)),
        var(--bg);
    }
    tr.group td {padding-top: 0.75rem; font-size: 0.74rem; white-space: normal;}
    td.vehicle {min-width: 8rem;}
    @media (hover: hover) {
      tbody tr:hover td.time {background: rgb(36, 42, 48);}
      tbody tr.ref:hover td.time {
        background:
          linear-gradient(rgba(57, 115, 172, 0.22), rgba(57, 115, 172, 0.22)),
          var(--bg);
      }
    }
  }
  @media (prefers-reduced-motion: reduce) {
    #content {animation: none;}
    .loading-bar::before {animation: none; width: 100%; transform: none; opacity: 0.65;}
  }
  th.actions, td.actions {width: 1%; text-align: right; white-space: nowrap;}
  button.rec-change {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
    border: 1px solid var(--panel-border); border-radius: 8px; min-height: 1.85rem;
    padding: 0.2rem 0.45rem; color: var(--soft); background: transparent; cursor: pointer;
  }
  button.rec-change svg {display: block; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;}
  @media (hover: hover) {
    button.rec-change:hover {border-color: var(--accent); color: var(--text);}
  }
  .suggest-dialog {
    width: min(36rem, calc(100vw - 2rem)); max-height: calc(100vh - 2rem); padding: 1.1rem 1.15rem 1rem;
    border: 0; border-radius: 16px; overflow: auto;
    background: rgb(40, 44, 50); color: var(--soft); text-align: left;
    box-shadow: 0 16px 50px rgba(0, 0, 0, 0.45);
  }
  .suggest-dialog::backdrop {background: rgba(12, 14, 18, 0.65);}
  .suggest-dialog, .suggest-dialog input, .suggest-dialog textarea, .suggest-dialog select {
    -webkit-user-select: text; -ms-user-select: text; user-select: text;
  }
  .suggest-head {display: flex; align-items: center; gap: 10px; margin: 0 0 0.75rem;}
  .suggest-head b {flex: 1; font-size: 1.15rem; font-weight: 650; color: var(--text);}
  .suggest-close {
    border: 0; border-radius: 8px; width: 2rem; height: 2rem; padding: 0; font: inherit;
    font-size: 1.25rem; line-height: 1; color: var(--muted); background: transparent; cursor: pointer;
  }
  .suggest-close:hover {background: rgba(255,255,255,0.06);}
  .suggest-dialog .rec-form {display: flex; flex-direction: column; gap: 0.65rem; position: relative;}
  .suggest-dialog .rec-types {display: flex; gap: 0.4rem; margin: 0; flex-wrap: wrap; align-items: center;}
  .suggest-dialog .rec-type {
    border: 0; border-radius: 999px; padding: 0.3rem 0.75rem; font: inherit; font-size: 0.82rem; font-weight: 650;
    color: var(--muted); background: rgba(255,255,255,0.06); cursor: pointer;
  }
  .suggest-dialog .rec-type.on {color: #fff; background: var(--accent);}
  .suggest-dialog .rec-meta {
    margin: 0; padding: 0.55rem 0.7rem; border-radius: 10px; background: rgba(255,255,255,0.04);
    font-size: 0.88rem; color: var(--muted); line-height: 1.4;
  }
  .suggest-dialog .rec-meta strong {color: var(--soft); font-weight: 650;}
  .suggest-dialog .rec-field {display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; position: relative;}
  .suggest-dialog .rec-field[hidden], .suggest-dialog .rec-edit-only[hidden] {display: none;}
  .suggest-dialog .rec-field span {
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
  }
  .suggest-dialog .rec-field input,
  .suggest-dialog .rec-field textarea,
  .suggest-dialog .rec-field select {
    width: 100%; box-sizing: border-box; border: 1px solid var(--input-border); border-radius: 8px;
    min-height: 2.4rem; padding: 0.5rem 0.65rem; font: inherit; font-size: 0.95rem; color: var(--soft); background: var(--input-bg);
  }
  .suggest-dialog .rec-field input:focus,
  .suggest-dialog .rec-field textarea:focus,
  .suggest-dialog .rec-field select:focus {outline: 2px solid var(--focus); outline-offset: 1px;}
  .suggest-dialog .rec-form-grid {display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem;}
  .suggest-dialog .rec-type-class {display: grid; grid-template-columns: 11em 1fr; gap: 0.65rem; align-items: end;}
  .suggest-dialog .rec-ymm {display: grid; grid-template-columns: calc(4.5ch + 1.2rem) 1fr 1fr; gap: 0.65rem;}
  .suggest-dialog .rec-field input[type=date] {color-scheme: dark;}
  .suggest-dialog .rec-field textarea {resize: vertical; min-height: 2.4rem;}
  .suggest-dialog .rec-form-actions {display: flex; gap: 0.5rem; margin-top: 0.25rem;}
  .suggest-dialog .rec-form-actions button {
    flex: 1; border: 0; border-radius: 10px; min-height: 2.5rem; padding: 0.55rem 0.85rem;
    font: inherit; font-size: 0.9rem; font-weight: 650; cursor: pointer;
  }
  .suggest-dialog .rec-submit {color: #fff; background: var(--accent);}
  .suggest-dialog .rec-submit:disabled {opacity: 0.6; cursor: default;}
  .suggest-dialog .rec-cancel {color: var(--muted); background: rgba(255,255,255,0.06);}
  .suggest-dialog .rec-form-msg {margin: 0; font-size: 0.88rem; text-align: center;}
  .suggest-dialog .rec-form-msg.ok {color: #7dcea0;}
  .suggest-dialog .rec-form-msg.err {color: var(--err);}
  .print-filters {display: none;}
  @media print {
    body {
      padding: 0.5in; background: white; color: #111;
    }
    a.brand, .filters, .results-bar, .export-actions, .loading, .add-record,
    th.actions, td.actions, th.evidence, td.evidence, .suggest-dialog {display: none !important;}
    .title-block {text-align: left;}
    h1 {color: #111; font-size: 1.25rem; margin-bottom: 0.35rem;}
    .print-filters {
      display: block; margin: 0 0 0.85rem; color: #444; font-size: 9.5pt; line-height: 1.4;
    }
    .table-wrap {
      max-height: none; overflow: visible; margin: 0; border: 0; border-radius: 0; background: transparent;
    }
    table {min-width: 0; width: 100%; font-size: 9.5pt; color: #111;}
    th, td {border-bottom: 1px solid #ccc; color: #111; background: transparent;}
    th {position: static; background: #f0f0f0; color: #333;}
    td.time, tr.group td, tbody tr.ref td {color: #111; background: transparent; box-shadow: none;}
    tr.group td {border-bottom: 0; padding-top: 0.85rem; color: #333;}
    tbody tr.ref td {background: #e8eef5;}
    a {color: #111; text-decoration: underline;}
  }

  </style>

</head>

  <script>
    const RECORDS_URL = "https://8fu4ilcse5.execute-api.us-east-1.amazonaws.com/getLapRecords";
    const TRACKS_URL = "https://atqtpmna66.execute-api.us-east-1.amazonaws.com/getTrackdays?include=tracks";

    const VEHICLE_LABELS = {C: "Car", M: "Motorcycle"};
    const LAP_TIME_RE = /^(?:\d{1,3}:[0-5]\d|[0-5]?\d)\.\d{1,3}$/;
    const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
    const CUSTOM_CLASS_VALUE = "__custom__";
    const SUGGESTED_CLASSES = {
      C: ["Open"],
      M: ["Open", "600cc", "Twins", "Lightweight", "Motard"],
    };

    let records = [];
    let trackNames = {};
    let trackSubtracks = {};
    let viewMode = "class";
    let paramsApplied = false;
    let referenceKey = null;
    let changeUi = {submitting: false, submitId: 0, action: "edit", record: null};
    let recordsUi = {submitting: false, submitId: 0};

    const statusEl = document.getElementById("status");

    const loadingEl = document.getElementById("loading");

    const changeDialog = document.getElementById("changeDialog");

    const recordMessage = document.getElementById("recordMessage");
    const addRecordButton = document.getElementById("add-record");

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[ch]));
    }

    function safeHttpUrl(value) {
      try {
        let url = new URL(String(value));
        if (url.protocol !== "http:" && url.protocol !== "https:") return "";
        return url.href;
      } catch (e) {
        return "";
      }
    }

    function timeToMs(time) {
      let text = String(time).trim();
      if (!LAP_TIME_RE.test(text)) return Number.MAX_SAFE_INTEGER;
      let colon = text.indexOf(":");
      let minutes = 0;
      let seconds = text;
      if (colon !== -1) {
        minutes = Number(text.slice(0, colon));
        seconds = text.slice(colon + 1);
      }
      return minutes * 60000 + Number(seconds) * 1000;
    }

    function trackKey() {
      return trackSelect.value;
    }

    function trackLabel(key) {
      return trackNames[key] || key;
    }

    function scopedRecords() {
      let vehicle = vehicleSelect.value;
      let track = trackKey();
      return records.filter(record => {
        if (track && String(record.track).toUpperCase() !== track) return false;
        if (vehicle && record.vehicleType !== vehicle) return false;
        return true;
      });
    }

    function trackHasSubtracks(key) {
      if (key) {
        if (Object.prototype.hasOwnProperty.call(trackSubtracks, key)) return trackSubtracks[key].length > 0;
        return records.some(record => String(record.track).toUpperCase() === key && record.subtrack);
      }
      if (Object.keys(trackSubtracks).some(name => trackSubtracks[name].length)) return true;
      return records.some(record => record.subtrack);
    }

    function showSubtracks() {
      return trackHasSubtracks(trackKey());
    }

    function syncSubtrackVisibility() {
      let show = showSubtracks();
      subtrackFilter.hidden = !show;
      subtrackCol.hidden = !show;
      if (!show) subtrackSelect.value = "";
      return show;
    }

    function syncTrackVisibility() {
      let show = !trackKey();
      trackCol.hidden = !show;
      return show;
    }

    function fillSelect(select, values, allLabel) {
      let current = select.value;
      let options = values.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("");
      select.innerHTML = `<option value="">${escapeHtml(allLabel)}</option>${options}`;
      select.value = values.includes(current) ? current : "";
    }

    function fillTrackSelect() {
      let current = trackKey() || (new URLSearchParams(location.search).get("track") || "").trim().toUpperCase();
      let keys = [...new Set(records.map(record => String(record.track).toUpperCase()))];
      if (current && !keys.includes(current)) keys.push(current);
      keys.sort((a, b) => trackLabel(a).localeCompare(trackLabel(b)) || a.localeCompare(b));
      let options = keys.map(key => `<option value="${escapeHtml(key)}">${escapeHtml(trackLabel(key))}</option>`).join("");
      trackSelect.innerHTML = `<option value="">All tracks</option>${options}`;
      trackSelect.value = keys.includes(current) ? current : "";
    }

    function fillDependentSelects() {
      let scoped = scopedRecords();
      let classes = [...new Set(scoped.map(record => record.vehicleClass || "").filter(Boolean))].sort((a, b) => a.localeCompare(b));
      let subtracks = [...new Set(scoped.map(record => record.subtrack || "").filter(Boolean))].sort((a, b) => a.localeCompare(b));
      fillSelect(classSelect, classes, "All classes");
      fillSelect(subtrackSelect, subtracks, "All subtracks");
      syncSubtrackVisibility();
    }

    function filteredRecords() {
      let terms = nameInput.value.toLowerCase().split(",").map(term => term.trim()).filter(Boolean);
      let vehicleClass = classSelect.value;
      let subtrack = subtrackSelect.value;
      return scopedRecords().filter(record => {
        if (vehicleClass && (record.vehicleClass || "") !== vehicleClass) return false;
        if (subtrack && (record.subtrack || "") !== subtrack) return false;
        if (!terms.length) return true;
        let name = [record.holder, record.vehicleYear, record.vehicleMake, record.vehicleModel].join(" ").toLowerCase();
        return terms.some(term => name.includes(term));
      });
    }

    function syncParams() {
      let url = new URL(location.href);
      let set = (key, value) => {
        if (value) url.searchParams.set(key, value);
        else url.searchParams.delete(key);
      };
      set("track", trackSelect.value);
      set("vehicle", vehicleSelect.value);
      set("class", classSelect.value);
      set("subtrack", subtrackSelect.value);
      set("q", nameInput.value.trim());
      set("view", viewMode === "time" ? "time" : "class");
      history.replaceState(null, "", url);
    }

    function applyParams() {
      let params = new URLSearchParams(location.search);
      let vehicle = params.get("vehicle") || "";
      if ([...vehicleSelect.options].some(option => option.value === vehicle)) vehicleSelect.value = vehicle;
      nameInput.value = params.get("q") || "";
      viewMode = params.get("view") === "time" ? "time" : "class";
      viewClassButton.classList.toggle("on", viewMode === "class");
      viewTimeButton.classList.toggle("on", viewMode === "time");
    }

    function applyDependentParams() {
      let params = new URLSearchParams(location.search);
      let vehicleClass = params.get("class") || "";
      let subtrack = params.get("subtrack") || "";
      if ([...classSelect.options].some(option => option.value === vehicleClass)) classSelect.value = vehicleClass;
      if ([...subtrackSelect.options].some(option => option.value === subtrack)) subtrackSelect.value = subtrack;
    }

    function compareRecords(a, b) {
      let byTime = timeToMs(a.time) - timeToMs(b.time);
      if (byTime !== 0) return byTime;
      return trackLabel(a.track).localeCompare(trackLabel(b.track)) || String(a.vehicleClass).localeCompare(String(b.vehicleClass));
    }

    function formatGap(ms) {
      ms = Math.round(ms);
      let sign = ms > 0 ? "+" : ms < 0 ? "\u2212" : "";
      ms = Math.abs(ms);
      let minutes = Math.floor(ms / 60000);
      let seconds = ((ms % 60000) / 1000).toFixed(3);
      if (!minutes) return `${sign}${seconds}`;
      let [whole, frac] = seconds.split(".");
      return `${sign}${minutes}:${whole.padStart(2, "0")}.${frac}`;
    }

    function formatLapTime(time) {
      let text = String(time || "").trim();
      let dot = text.indexOf(".");
      if (dot === -1) return text;
      return text.slice(0, dot + 1) + text.slice(dot + 1).padEnd(3, "0");
    }

    function todayIso() {
      let now = new Date();
      let y = now.getFullYear();
      let m = String(now.getMonth() + 1).padStart(2, "0");
      let d = String(now.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function parseOptionalYear(text) {
      let raw = String(text || "").trim();
      if (!raw) return {ok: true, error: "", value: null};
      let year = Number(raw);
      let maxYear = new Date().getFullYear() + 1;
      if (!Number.isInteger(year) || year < 1885 || year > maxYear) {
        return {ok: false, error: "Enter a vehicle year.", value: null};
      }
      return {ok: true, error: "", value: year};
    }

    function validateVehicleMake(text) {
      if (!text || text.length > 40) return "Enter a vehicle make.";
      return "";
    }

    function validateVehicleModel(text) {
      if (!text || text.length > 60) return "Enter a vehicle model.";
      return "";
    }

    function validateLapTime(text) {
      if (!LAP_TIME_RE.test(text)) return "Enter a time like 1:23.456 or 54.32.";
      return "";
    }

    function validateLapDate(text) {
      if (!DATE_RE.test(text) || text > todayIso()) return "Enter the date of the lap.";
      return "";
    }

    function validateEvidence(text) {
      if (text && (!safeHttpUrl(text) || text.length > 300)) return "Evidence link must be an http(s) URL.";
      return "";
    }

    function validateNote(text, required) {
      if (required && !text) return "Enter a note.";
      if (text.length > 300) return "Note is too long.";
      return "";
    }

    function validateSharedEditFields(draft) {
      let year = parseOptionalYear(draft.vehicleYear);
      if (!year.ok) return year.error;
      return (
        validateVehicleMake(draft.vehicleMake) ||
        validateVehicleModel(draft.vehicleModel) ||
        validateLapTime(draft.time) ||
        validateLapDate(draft.date) ||
        validateEvidence(draft.evidence) ||
        validateNote(draft.note, false) ||
        ""
      );
    }

    function recordKey(record) {
      if (record.recordId) return "id:" + record.recordId;
      return [
        record.time || "",
        String(record.track || "").toUpperCase(),
        record.subtrack || "",
        record.holder || "",
        record.vehicleType || "",
        record.vehicleClass || "",
        record.vehicleYear || "",
        record.vehicleMake || "",
        record.vehicleModel || "",
        record.date || "",
        record.evidence || "",
      ].join("\u001f");
    }

    function findRecordByKey(key) {
      return records.find(record => recordKey(record) === key) || null;
    }

    function gapFromReference(record, refMs) {
      if (refMs == null) return null;
      let ms = timeToMs(record.time);
      if (ms === Number.MAX_SAFE_INTEGER || refMs === Number.MAX_SAFE_INTEGER) return null;
      if (recordKey(record) === referenceKey) return null;
      return ms - refMs;
    }

    function csvEscape(value) {
      let text = String(value == null ? "" : value);
      if (/[",\n\r]/.test(text)) return `"${text.replace(/"/g, '""')}"`;
      return text;
    }

    function exportCsv() {
      let shown = filteredRecords().slice().sort(compareRecords);
      if (!shown.length) return;
      let headers = ["Time", "Track", "Subtrack", "Holder", "Vehicle", "Type", "Class", "Date", "Evidence"];
      let lines = [headers.map(csvEscape).join(",")];
      shown.forEach(record => {
        let vehicle = [record.vehicleYear, record.vehicleMake, record.vehicleModel]
          .filter(value => value != null && value !== "")
          .join(" ");
        lines.push([
          record.time || "",
          trackLabel(record.track),
          record.subtrack || "",
          record.holder || "",
          vehicle,
          VEHICLE_LABELS[record.vehicleType] || record.vehicleType || "",
          record.vehicleClass || "",
          record.date || "",
          record.evidence || "",
        ].map(csvEscape).join(","));
      });
      let blob = new Blob(["\uFEFF" + lines.join("\r\n")], {type: "text/csv;charset=utf-8"});
      let url = URL.createObjectURL(blob);
      let link = document.createElement("a");
      link.href = url;
      link.download = "lap-records.csv";
      link.click();
      URL.revokeObjectURL(url);
    }

    function activeFilterSummary() {
      let parts = [];
      let track = trackKey();
      if (track) parts.push(`Track: ${trackLabel(track)}`);
      if (vehicleSelect.value) {
        parts.push(`Vehicle: ${VEHICLE_LABELS[vehicleSelect.value] || vehicleSelect.value}`);
      }
      if (classSelect.value) parts.push(`Class: ${classSelect.value}`);
      if (subtrackSelect.value && !subtrackFilter.hidden) parts.push(`Subtrack: ${subtrackSelect.value}`);
      let query = nameInput.value.trim();
      if (query) parts.push(`Search: ${query}`);
      let view = `View: ${viewMode === "time" ? "Time" : "Class"}`;
      return parts.length ? `${parts.join(" · ")} · ${view}` : `Filters: none · ${view}`;
    }

    function printRecords() {
      if (!filteredRecords().length) return;
      printFiltersEl.textContent = activeFilterSummary();
      window.print();
    }

    function recordRow(record, includeClass, includeTrack, includeSubtrack, includeType, gapMs) {
      let key = recordKey(record);
      let isRef = key === referenceKey;
      let vehicle = [record.vehicleYear, record.vehicleMake, record.vehicleModel].filter(value => value != null && value !== "").join(" ");
      let type = includeType ? (VEHICLE_LABELS[record.vehicleType] || record.vehicleType || "") : "";
      let classLabel = [type, record.vehicleClass || ""].filter(Boolean).join(" · ");
      let evidence = safeHttpUrl(record.evidence);
      let evidenceCell = evidence ? `<a href="${escapeHtml(evidence)}" target="_blank" rel="noopener">View</a>` : "";
      let classCell = includeClass ? `<td>${escapeHtml(classLabel)}</td>` : "";
      let trackCell = includeTrack ? `<td>${escapeHtml(trackLabel(record.track))}</td>` : "";
      let subCell = includeSubtrack ? `<td>${escapeHtml(record.subtrack || "")}</td>` : "";
      let gap = gapMs == null ? "" : ` <span class="gap">${formatGap(gapMs)}</span>`;
      let canChange = !!record.recordId;
      let actionIcon = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
      let actionCell = canChange
        ? `<td class="actions"><button type="button" class="rec-change" data-key="${escapeHtml(key)}" title="Update or delete/protest" aria-label="Update or delete/protest">${actionIcon}</button></td>`
        : `<td class="actions"></td>`;
      return `<tr class="${isRef ? "ref" : ""}" data-key="${escapeHtml(key)}">
        <td class="time">${escapeHtml(record.time || "")}${gap}</td>
        ${trackCell}
        ${subCell}
        <td>${escapeHtml(record.holder || "")}</td>
        <td class="vehicle">${escapeHtml(vehicle)}</td>
        ${classCell}
        <td>${escapeHtml(record.date || "")}</td>
        <td class="evidence">${evidenceCell}</td>
        ${actionCell}
      </tr>`;
    }

    function classGroups(shown) {
      let groups = new Map();
      shown.forEach(record => {
        let key = [
          String(record.track || "").toUpperCase(),
          record.subtrack || "",
          record.vehicleType || "",
          record.vehicleClass || "",
        ].join("\0");
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(record);
      });
      return [...groups.entries()].sort((a, b) => {
        let best = rows => Math.min(...rows.map(record => timeToMs(record.time)));
        let byTime = best(a[1]) - best(b[1]);
        if (byTime !== 0) return byTime;
        return a[0].localeCompare(b[0]);
      });
    }

    function groupLabel(key, flags) {
      let [track, subtrack, typeCode, className] = key.split("\0");
      let type = VEHICLE_LABELS[typeCode] || typeCode || "";
      let parts = [];
      if (flags.track) parts.push(trackLabel(track));
      if (flags.includeType && type) parts.push(type);
      if (className) parts.push(className);
      if (flags.subtrack && subtrack) parts.push(subtrack);
      return parts.filter(Boolean).join(" · ");
    }

    function renderRows() {
      let shown = filteredRecords();
      if (referenceKey && !shown.some(record => recordKey(record) === referenceKey)) referenceKey = null;
      let byClass = viewMode === "class";
      let includeTrack = syncTrackVisibility();
      let includeSubtrack = syncSubtrackVisibility();
      let includeType = !vehicleSelect.value;
      let refRecord = referenceKey && shown.find(record => recordKey(record) === referenceKey);
      let refMs = refRecord ? timeToMs(refRecord.time) : null;
      classCol.hidden = byClass;
      let colspan = 9 - (byClass ? 1 : 0) - (includeTrack ? 0 : 1) - (includeSubtrack ? 0 : 1);
      statusEl.className = "status";
      statusEl.textContent = `${shown.length} record${shown.length === 1 ? "" : "s"}`;
      exportCsvButton.disabled = !shown.length;
      printButton.disabled = !shown.length;
      if (!shown.length) {
        rowsEl.innerHTML = `<tr><td class="empty" colspan="${colspan}">No records match</td></tr>`;
        return;
      }
      if (!byClass) {
        rowsEl.innerHTML = shown.sort(compareRecords).map(record => {
          return recordRow(record, true, includeTrack, includeSubtrack, includeType, gapFromReference(record, refMs));
        }).join("");
        return;
      }
      let flags = {
        track: includeTrack && new Set(shown.map(record => String(record.track || "").toUpperCase())).size > 1,
        includeType,
        subtrack: includeSubtrack && new Set(shown.map(record => record.subtrack || "")).size > 1,
      };
      rowsEl.innerHTML = classGroups(shown).map(([key, rows]) => {
        let label = groupLabel(key, flags);
        let head = `<tr class="group"><td colspan="${colspan}">${escapeHtml(label)}</td></tr>`;
        rows.sort(compareRecords);
        let best = timeToMs(rows[0].time);
        return head + rows.map((record, index) => {
          let gap = refMs != null
            ? gapFromReference(record, refMs)
            : (index === 0 || timeToMs(record.time) === Number.MAX_SAFE_INTEGER || best === Number.MAX_SAFE_INTEGER
              ? null
              : timeToMs(record.time) - best);
          return recordRow(record, false, includeTrack, includeSubtrack, includeType, gap);
        }).join("");
      }).join("");
    }

    function render() {
      if (!paramsApplied) applyParams();
      fillTrackSelect();
      fillDependentSelects();
      if (!paramsApplied) {
        applyDependentParams();
        paramsApplied = true;
      }
      renderRows();
    }

    trackSelect.addEventListener("change", () => {
      fillDependentSelects();
      syncParams();
      renderRows();
    });
    vehicleSelect.addEventListener("change", () => {
      fillDependentSelects();
      syncParams();
      renderRows();
    });
    classSelect.addEventListener("change", () => {
      syncParams();
      renderRows();
    });
    subtrackSelect.addEventListener("change", () => {
      syncParams();
      renderRows();
    });
    nameInput.addEventListener("input", () => {
      syncParams();
      renderRows();
    });
    function setView(mode) {
      viewMode = mode;
      viewClassButton.classList.toggle("on", mode === "class");
      viewTimeButton.classList.toggle("on", mode === "time");
      syncParams();
      renderRows();
    }
    viewClassButton.addEventListener("click", () => setView("class"));
    viewTimeButton.addEventListener("click", () => setView("time"));
    exportCsvButton.addEventListener("click", exportCsv);
    printButton.addEventListener("click", printRecords);
    rowsEl.addEventListener("click", (event) => {
      let changeBtn = event.target.closest("button.rec-change");
      if (changeBtn) {
        event.stopPropagation();
        openChangeDialog(changeBtn.getAttribute("data-key"));
        return;
      }
      if (event.target.closest("a")) return;
      let row = event.target.closest("tr[data-key]");

      renderRows();
    });

    function setFormMessage(el, message) {
      if (!el) return;
      if (!message) {
        el.hidden = true;
        el.textContent = "";
        el.className = "rec-form-msg";
        return;
      }
      el.hidden = false;
      el.textContent = message.text;
      el.className = "rec-form-msg " + message.kind;
    }

    function setFormSubmitting(state, form, submitting, extraEls) {
      state.submitting = submitting;
      let button = form.querySelector(".rec-submit");
      if (button) {
        button.disabled = submitting;
        button.textContent = submitting ? "Submitting..." : "Submit for Review";
      }
      form.querySelectorAll(".rec-type, .rec-cancel, .suggest-close").forEach(el => {
        el.disabled = submitting;
      });
      (extraEls || []).forEach(el => {
        if (el) el.disabled = submitting;
      });
    }

    async function postLapRecord(payload) {
      let res = await fetch(LAP_RECORD_SUBMIT_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw Object.assign(new Error("HTTP " + res.status), {status: res.status});
      return res;
    }

    async function submitReview(event, opts) {
      event.preventDefault();
      if (opts.state.submitting) return;
      let error = opts.validate();
      if (error) {
        setFormMessage(opts.messageEl, {kind: "err", text: error});
        return;
      }
      let started = ++opts.state.submitId;
      opts.setSubmitting(true);
      setFormMessage(opts.messageEl, null);
      try {
        await postLapRecord(opts.payload());
        if (opts.state.submitId !== started) return;
        opts.onSuccess();
        setFormMessage(opts.messageEl, {kind: "ok", text: "Submitted for review."});
      } catch (err) {
        if (opts.state.submitId !== started) return;
        let text = err && err.status ? "Unable to submit (" + err.status + ")." : "Unable to submit. Try again.";
        setFormMessage(opts.messageEl, {kind: "err", text});
      }
      if (opts.state.submitId === started) opts.setSubmitting(false);
    }

    function setChangeSubmitting(submitting) {
      setFormSubmitting(changeUi, changeForm, submitting);
    }

    function setChangeAction(action) {
      changeUi.action = action === "contest" ? "contest" : "edit";
      changeForm.querySelectorAll(".rec-type[data-action]").forEach(btn => {
        btn.classList.toggle("on", btn.getAttribute("data-action") === changeUi.action);
      });
      let editOnly = changeForm.querySelector(".rec-edit-only");
      editOnly.hidden = changeUi.action !== "edit";
      changeNoteLabel.textContent = changeUi.action === "edit" ? "Note to reviewer (optional)" : "Note to reviewer (required)";
      changeForm.elements.note.rows = changeUi.action === "edit" ? 2 : 8;
      document.getElementById("changeTitle").textContent =
        changeUi.action === "edit" ? "Update Record" : "Delete/Protest Record";
      setFormMessage(changeMessage, null);
    }

    function fillChangeForm(record) {
      changeUi.record = record;
      changeForm.reset();
      let type = VEHICLE_LABELS[record.vehicleType] || record.vehicleType || "";
      let parts = [
        `<strong>${escapeHtml(trackLabel(record.track))}</strong>`,
        record.subtrack ? escapeHtml(record.subtrack) : "",
        escapeHtml(record.holder || ""),
        [type, record.vehicleClass].filter(Boolean).map(escapeHtml).join(" · "),
      ].filter(Boolean);
      changeMeta.innerHTML = parts.join(" · ");
      changeForm.elements.vehicleYear.value = record.vehicleYear != null ? String(record.vehicleYear) : "";
      changeForm.elements.vehicleMake.value = record.vehicleMake || "";
      changeForm.elements.vehicleModel.value = record.vehicleModel || "";
      changeForm.elements.time.value = record.time || "";
      changeForm.elements.date.value = record.date || "";
      changeForm.elements.date.max = todayIso();
      changeForm.elements.evidence.value = record.evidence || "";
      changeForm.elements.note.value = "";
      setChangeAction("edit");
      setChangeSubmitting(false);
      setFormMessage(changeMessage, null);
    }

    function openChangeDialog(key) {
      let record = findRecordByKey(key);
      if (!record || !record.recordId) return;
      fillChangeForm(record);
      if (!changeDialog.open) changeDialog.showModal();
      let first = changeForm.querySelector(".rec-edit-only input, .rec-edit-only select");
      if (first) first.focus();
    }

    function closeChangeDialog() {
      if (changeUi.submitting) return;
      if (changeDialog.open) changeDialog.close();
    }

    function readChangeDraft() {
      return {
        vehicleYear: String(changeForm.elements.vehicleYear.value || "").trim(),
        vehicleMake: String(changeForm.elements.vehicleMake.value || "").trim(),
        vehicleModel: String(changeForm.elements.vehicleModel.value || "").trim(),
        time: String(changeForm.elements.time.value || "").trim(),
        date: String(changeForm.elements.date.value || "").trim(),
        evidence: String(changeForm.elements.evidence.value || "").trim(),
        note: String(changeForm.elements.note.value || "").trim(),
      };
    }

    function sameLapTime(a, b) {
      return formatLapTime(a) === formatLapTime(b);
    }

    function validateChangeDraft(draft) {
      let record = changeUi.record;
      if (!record || !record.recordId) return "Choose a lap record.";
      if (changeUi.action === "contest") return validateNote(draft.note, true);
      let shared = validateSharedEditFields(draft);
      if (shared) return shared;
      let year = parseOptionalYear(draft.vehicleYear).value;
      let currentYear = record.vehicleYear != null && record.vehicleYear !== ""
        ? Number(record.vehicleYear)
        : null;
      let changed =
        year !== currentYear ||
        draft.vehicleMake !== (record.vehicleMake || "") ||
        draft.vehicleModel !== (record.vehicleModel || "") ||
        !sameLapTime(draft.time, record.time) ||
        draft.date !== (record.date || "") ||
        draft.evidence !== (record.evidence || "");
      if (!changed) return "Change at least one field.";
      return "";
    }

    function changePayload(draft) {
      let record = changeUi.record;
      let payload = {
        action: changeUi.action,
        recordId: record.recordId,
        track: record.track,
      };
      if (draft.note) payload.note = draft.note;
      if (changeUi.action === "contest") return payload;
      payload.time = formatLapTime(draft.time);
      payload.date = draft.date;
      payload.vehicleYear = parseOptionalYear(draft.vehicleYear).value;
      payload.vehicleMake = draft.vehicleMake;
      payload.vehicleModel = draft.vehicleModel;
      payload.evidence = draft.evidence;
      return payload;
    }

    async function submitChangeForm(event) {
      let draft = readChangeDraft();
      await submitReview(event, {
        state: changeUi,
        messageEl: changeMessage,
        setSubmitting: setChangeSubmitting,
        validate: () => validateChangeDraft(draft),
        payload: () => changePayload(draft),
        onSuccess() {
          let action = changeUi.action;
          fillChangeForm(changeUi.record);
          setChangeAction(action);
        },
      });
    }

    changeForm.addEventListener("submit", submitChangeForm);
    changeForm.addEventListener("input", () => {
      if (!changeMessage.hidden && changeMessage.classList.contains("err")) setFormMessage(changeMessage, null);
    });
    changeForm.querySelectorAll(".rec-type[data-action]").forEach(btn => {
      btn.addEventListener("click", () => {
        if (changeUi.submitting) return;
        setChangeAction(btn.getAttribute("data-action"));
      });
    });
    document.getElementById("change-close").addEventListener("click", closeChangeDialog);
    document.getElementById("change-cancel").addEventListener("click", closeChangeDialog);
    changeDialog.addEventListener("cancel", (event) => {
      if (changeUi.submitting) event.preventDefault();
    });

    function suggestedClasses(code) {
      return SUGGESTED_CLASSES[code] || [];
    }

    function formClasses(code, trackKey) {
      let suggested = suggestedClasses(code);
      let bestMs = new Map();
      records.forEach(record => {
        if (String(record.track || "").toUpperCase() !== String(trackKey || "").toUpperCase()) return;
        if (record.vehicleType !== code) return;
        let name = record.vehicleClass || "";
        if (!name) return;
        let ms = timeToMs(record.time);
        if (!bestMs.has(name) || ms < bestMs.get(name)) bestMs.set(name, ms);
      });
      let suggestedIndex = new Map(suggested.map((name, index) => [name, index]));
      let names = [...new Set([...suggested, ...bestMs.keys()])];
      let noTime = Number.MAX_SAFE_INTEGER;
      names.sort((a, b) => {
        let aMs = bestMs.has(a) ? bestMs.get(a) : noTime;
        let bMs = bestMs.has(b) ? bestMs.get(b) : noTime;
        if (aMs !== bMs) return aMs - bMs;
        if (aMs === noTime) {
          let aIndex = suggestedIndex.has(a) ? suggestedIndex.get(a) : suggested.length;
          let bIndex = suggestedIndex.has(b) ? suggestedIndex.get(b) : suggested.length;
          if (aIndex !== bIndex) return aIndex - bIndex;
        }
        return a.localeCompare(b);
      });
      return names;
    }

    function fillSelectOptions(select, options, selectedValue) {
      if (!select) return "";
      select.replaceChildren();
      options.forEach(name => {
        let option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        select.appendChild(option);
      });
      if (selectedValue != null && options.includes(selectedValue)) {
        select.value = selectedValue;
        return selectedValue;
      }
      if (options.length) {
        select.value = options[0];
        return options[0];
      }
      select.value = "";
      return "";
    }

    function fillSelectWithOther(select, options, selectedValue, otherValue) {
      if (!select) return "";
      fillSelectOptions(select, options, options.includes(selectedValue) ? selectedValue : null);
      let other = document.createElement("option");
      other.value = otherValue;
      other.textContent = "Other";
      select.appendChild(other);
      let choice = options[0] || otherValue;
      if (selectedValue === otherValue) choice = otherValue;
      else if (options.includes(selectedValue)) choice = selectedValue;
      select.value = choice;
      return choice;
    }

    function showRecordCustomClass(form, show) {
      let el = form.querySelector(".rec-custom-class");
      if (el) el.hidden = !show;
    }

    function fillRecordTracks(form, selectedKey) {
      let select = form.elements.track;
      let keys = [...new Set([
        ...Object.keys(trackNames),
        ...records.map(record => String(record.track).toUpperCase()),
      ])];
      if (selectedKey && !keys.includes(selectedKey)) keys.push(selectedKey);
      keys.sort((a, b) => trackLabel(a).localeCompare(trackLabel(b)) || a.localeCompare(b));
      select.replaceChildren();
      let blank = document.createElement("option");
      blank.value = "";
      blank.textContent = "Select a track";
      select.appendChild(blank);
      keys.forEach(key => {
        let option = document.createElement("option");
        option.value = key;
        option.textContent = trackLabel(key);
        select.appendChild(option);
      });
      select.value = keys.includes(selectedKey) ? selectedKey : "";
    }

    function fillRecordClassOptions(form, type, selectedValue) {
      let classes = formClasses(type, form.elements.track.value);
      let choice = fillSelectWithOther(form.elements.vehicleClass, classes, selectedValue, CUSTOM_CLASS_VALUE);
      showRecordCustomClass(form, choice === CUSTOM_CLASS_VALUE);
    }

    function refillRecordClasses(form, type, missingClass) {
      let classes = formClasses(type, form.elements.track.value);
      let selected = form.elements.vehicleClass.value;
      let customText = form.elements.customClass.value;
      let next;
      let clearCustom = false;
      if (selected === CUSTOM_CLASS_VALUE && (missingClass !== "named" || classes.includes(customText))) {
        next = CUSTOM_CLASS_VALUE;
      } else if (selected !== CUSTOM_CLASS_VALUE && (classes.includes(selected) || missingClass === "refresh")) {
        next = selected;
      } else {
        next = classes[0] || "";
        clearCustom = true;
      }
      fillRecordClassOptions(form, type, next);
      if (next === CUSTOM_CLASS_VALUE) form.elements.customClass.value = customText;
      else if (clearCustom) form.elements.customClass.value = "";
    }

    function fillRecordSubtracks(form, trackKey) {
      let select = form.elements.subtrack;
      let field = select.closest(".rec-field");
      let known = trackSubtracks[trackKey] || [];
      let fromRecords = [...new Set(
        records
          .filter(record => String(record.track || "").toUpperCase() === String(trackKey || "").toUpperCase())
          .map(record => record.subtrack || "")
          .filter(Boolean)
      )].sort((a, b) => a.localeCompare(b));
      let options = [...new Set([...known, ...fromRecords])];
      let prev = select.value;
      fillSelectOptions(select, options, prev);
      if (field) field.hidden = !options.length;
    }

    function prepareRecordForm(form, trackKey, type) {
      form.reset();
      form.elements.vehicleType.value = type;
      form.elements.customClass.value = "";
      fillRecordTracks(form, trackKey);
      fillRecordClassOptions(form, type, formClasses(type, trackKey)[0] || "");
      fillRecordSubtracks(form, trackKey);
      form.elements.date.max = todayIso();
    }

    function setRecordSubmitting(submitting) {
      setFormSubmitting(recordsUi, recordForm, submitting, [
        recordForm.elements.track,
        recordForm.elements.vehicleType,
        recordForm.elements.vehicleClass,
      ]);
    }

    function openRecordForm() {
      let preferredTrack = trackKey();
      let preferredType = vehicleSelect.value === "M" ? "M" : "C";
      if (!suggestedClasses(preferredType).length) preferredType = "C";
      recordsUi.submitting = false;
      prepareRecordForm(recordForm, preferredTrack, preferredType);
      setRecordSubmitting(false);
      setFormMessage(recordMessage, null);
      if (!recordDialog.open) recordDialog.showModal();
      let focus = [...recordForm.querySelectorAll("input, textarea, select")].find(el => !el.closest("[hidden]"));
      if (focus) focus.focus();
    }

    function closeRecordForm() {
      if (recordsUi.submitting) return;
      if (recordDialog.open) recordDialog.close();
    }

    function readCreateDraft(form) {
      let data = new FormData(form);
      let selectedClass = String(data.get("vehicleClass") || "");
      let classIsCustom = selectedClass === CUSTOM_CLASS_VALUE;
      return {
        track: form.elements.track.value,
        vehicleType: String(data.get("vehicleType") || ""),
        vehicleClass: classIsCustom ? String(data.get("customClass") || "").trim() : selectedClass,
        classIsCustom,
        vehicleYear: String(data.get("vehicleYear") || "").trim(),
        vehicleMake: String(data.get("vehicleMake") || "").trim(),
        vehicleModel: String(data.get("vehicleModel") || "").trim(),
        subtrack: String(data.get("subtrack") || "").trim(),
        time: String(data.get("time") || "").trim(),
        holder: String(data.get("holder") || "").trim(),
        date: String(data.get("date") || "").trim(),
        evidence: String(data.get("evidence") || "").trim(),
        note: String(data.get("note") || "").trim(),
      };
    }

    function validateCreateDraft(draft) {
      if (!draft.track || draft.track.length > 40) return "Choose a track.";
      if (!suggestedClasses(draft.vehicleType).length) return "Choose a vehicle type.";
      if (draft.classIsCustom) {
        if (!draft.vehicleClass || draft.vehicleClass.length > 40) return "Enter a class.";
      } else if (!formClasses(draft.vehicleType, draft.track).includes(draft.vehicleClass)) {
        return "Choose a class.";
      }
      let shared = validateSharedEditFields(draft);
      if (shared) return shared;
      let subtracks = [
        ...(trackSubtracks[draft.track] || []),
        ...records
          .filter(record => String(record.track || "").toUpperCase() === draft.track)
          .map(record => record.subtrack || "")
          .filter(Boolean),
      ];
      let knownSubtracks = [...new Set(subtracks)];
      if (knownSubtracks.length && !knownSubtracks.includes(draft.subtrack)) return "Choose a subtrack.";
      if (draft.subtrack.length > 40) return "Subtrack is too long.";
      if (!draft.holder || draft.holder.length > 80) return "Enter the record holder.";
      return "";
    }

    function createPayload(draft) {
      let payload = {
        action: "create",
        track: draft.track,
        vehicleType: draft.vehicleType,
        vehicleClass: draft.vehicleClass,
        vehicleMake: draft.vehicleMake,
        vehicleModel: draft.vehicleModel,
        subtrack: draft.subtrack,
        time: formatLapTime(draft.time),
        holder: draft.holder,
        date: draft.date,
      };
      let year = parseOptionalYear(draft.vehicleYear).value;
      if (year != null) payload.vehicleYear = year;
      if (draft.evidence) payload.evidence = draft.evidence;
      if (draft.note) payload.note = draft.note;
      return payload;
    }

    async function submitCreateForm(event) {
      let draft = readCreateDraft(recordForm);
      await submitReview(event, {
        state: recordsUi,
        messageEl: recordMessage,
        setSubmitting: setRecordSubmitting,
        validate: () => validateCreateDraft(draft),
        payload: () => createPayload(draft),
        onSuccess() {
          prepareRecordForm(recordForm, draft.track, draft.vehicleType);
        },
      });
    }

    addRecordButton.addEventListener("click", openRecordForm);
    recordForm.addEventListener("submit", submitCreateForm);
    recordForm.addEventListener("input", () => {
      if (!recordMessage.hidden && recordMessage.classList.contains("err")) setFormMessage(recordMessage, null);
    });
    recordForm.elements.track.addEventListener("change", () => {
      recordForm.elements.subtrack.value = "";
      fillRecordSubtracks(recordForm, recordForm.elements.track.value);
      refillRecordClasses(recordForm, recordForm.elements.vehicleType.value, "reset");
    });
    recordForm.elements.vehicleType.addEventListener("change", () => {
      refillRecordClasses(recordForm, recordForm.elements.vehicleType.value, "named");
      setFormMessage(recordMessage, null);
    });
    recordForm.elements.vehicleClass.addEventListener("change", () => {
      let show = recordForm.elements.vehicleClass.value === CUSTOM_CLASS_VALUE;
      showRecordCustomClass(recordForm, show);
      if (show) recordForm.elements.customClass.focus();
    });
    document.getElementById("record-close").addEventListener("click", closeRecordForm);
    document.getElementById("record-cancel").addEventListener("click", closeRecordForm);
    recordDialog.addEventListener("cancel", (event) => {
      if (recordsUi.submitting) event.preventDefault();
    });

    function showResults() {
      loadingEl.hidden = true;
      contentEl.hidden = false;
    }

    function showError(message) {
      statusEl.className = "status err";
      statusEl.textContent = message;
      rowsEl.innerHTML = "";
      loadingEl.classList.add("err");
      loadingEl.querySelector("p").textContent = message;
    }

    async function loadPage() {
      let recordsResult;
      let tracksResult;
      try {
        recordsResult = await fetch(RECORDS_URL);
        if (!recordsResult.ok) throw new Error("HTTP " + recordsResult.status);
        records = await recordsResult.json();
        if (!Array.isArray(records)) throw new Error("Unable to load lap records.");
      } catch (err) {
        records = [];
        showError(err && err.message && err.message.startsWith("HTTP ") ? err.message : "Unable to load lap records.");
        return;
      }
      try {
        tracksResult = await fetch(TRACKS_URL);
        if (tracksResult.ok) {
          let data = await tracksResult.json();
          (data.tracks || []).forEach(track => {
            if (!track.nickname) return;
            let key = String(track.nickname).toUpperCase();
            trackNames[key] = track.name || track.nickname;
            trackSubtracks[key] = Array.isArray(track.subtracks)
              ? track.subtracks.map(name => String(name || "").trim()).filter(Boolean)
              : [];
          });
        }
      } catch (err) {
        trackNames = {};
        trackSubtracks = {};
      }
      render();
      showResults();
    }

    loadPage();
  </script>
</body>
</html>
